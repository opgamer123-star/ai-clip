<!doctype html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auto Clipper</title>
<link rel="manifest" href="data:application/json,%7B%22name%22%3A%22Auto%20Clipper%22%2C%22display%22%3A%22standalone%22%2C%22start_url%22%3A%22%2F%22%7D">
<style>
:root{--bg:#f3f1ec;--fg:#16181d;--mut:#5d636e;--card:#fff;--line:#d9d6ce;--acc:#ffd700;--on:#16181d}
@media(prefers-color-scheme:dark){:root{--bg:#101216;--fg:#eceef2;--mut:#98a0ad;--card:#191c22;--line:#2a2e36}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:1.9rem;margin:0 0 4px;letter-spacing:-.02em}p.s{color:var(--mut);margin:0 0 20px}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px}
label{display:grid;gap:4px;font-size:.9rem;color:var(--mut)}
input,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;width:100%}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.chk{display:flex;gap:8px;align-items:center}.chk input{width:auto}
details summary{cursor:pointer;font-weight:600}details .row{margin-top:12px}
button{font:inherit;font-weight:600;background:var(--acc);color:var(--on);border:0;border-radius:6px;padding:12px;cursor:pointer}
button:disabled{opacity:.5}:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#st{margin-top:16px;display:none}.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .4s}
#err{color:#d33}#out{display:grid;gap:16px;margin-top:20px}
.clip{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
video{width:100%;max-height:70vh;background:#000;border-radius:6px}
.clip a,#out>a{display:inline-block;margin-top:8px;font-weight:600;color:var(--fg)}
</style></head><body><main>
<h1>Auto Clipper</h1><p class="s">Video upload karo. Captions wale clips ban ke aayenge.</p>
<div class="box">
<label>Video file<input id="file" type="file" accept="video/*"></label>
<div class="row" id="main"></div>
<details><summary>Aur options (format, captions, effects)</summary><div class="row" id="adv"></div>
<div class="row"><label class="chk"><input id="hook" type="checkbox" checked>Upar hook title</label>
<label class="chk"><input id="zoom" type="checkbox">Slow zoom effect</label></div></details>
<label>Access code (agar lagaya ho)<input id="code" type="password"></label>
<button id="go">Clips banao</button></div>
<div id="st"><div class="bar"><i id="pb"></i></div><p id="msg"></p><p id="err"></p></div>
<div id="out"></div></main>
<script>
const $=i=>document.getElementById(i),sl=ms=>new Promise(r=>setTimeout(r,ms));
const MAIN=[["n","Kitne clips",[[3,"3"],[5,"5"],[8,"8"],[10,"10"]],5],["len","Clip length",[["15,30","15-30 sec"],["20,45","20-45 sec"],["30,60","30-60 sec"],["45,90","45-90 sec"]],"20,45"],
["style","Kaise clips chunein",[["viral","Viral / hook wale"],["funny","Funny"],["insight","Useful baatein"],["news","News / announcements"]],"viral"],["aspect","Format",[["9:16","Vertical 9:16 (Shorts/Reels)"],["1:1","Square 1:1"],["4:5","Portrait 4:5"],["16:9","Wide 16:9"]],"9:16"]];
const ADV=[["layout","Video fit",[["blur","Poori video + blur"],["crop","Center crop"]],"blur"],["res","Quality",[[480,"480p (fast)"],[720,"720p"],[1080,"1080p (slow)"]],720],
["cap","Caption style",[["gold","Bold + peela highlight"],["white","Sirf white"],["box","Box ke andar"],["none","Captions nahi"]],"gold"],["pos","Caption jagah",[["bottom","Neeche"],["center","Beech"],["top","Upar"]],"bottom"],
["wpl","Ek baar mein shabd",[[1,"1"],[2,"2"],[3,"3"],[4,"4"]],3]];
const mk=(a,box)=>a.forEach(([id,l,o,d])=>{box.insertAdjacentHTML("beforeend",`<label>${l}<select id="${id}">${o.map(([v,t])=>`<option value="${v}"${v==d?" selected":""}>${t}</option>`).join("")}</select></label>`)});
mk(MAIN,$("main"));mk(ADV,$("adv"));try{$("code").value=localStorage.code||""}catch(e){}
async function upload(file,code){
 const f=new FormData();f.append("name",file.name);f.append("code",code);
 const r=await fetch("/api/upload/init",{method:"POST",body:f});
 if(!r.ok)throw new Error((await r.json()).detail||"Upload shuru nahi hua");
 const {id}=await r.json(),S=8*1048576,N=Math.max(1,Math.ceil(file.size/S));
 for(let i=0;i<N;i++){let ok=false;
  for(let t=0;t<6&&!ok;t++){try{ok=(await fetch(`/api/upload/${id}?i=${i}`,{method:"POST",body:file.slice(i*S,(i+1)*S)})).ok}catch(e){}if(!ok)await sl(1500*(t+1))}
  if(!ok)throw new Error("Upload beech mein fail hua. Internet check karke dobara try karo");
  const p=Math.round((i+1)/N*100);$("msg").textContent=`Upload ho raha hai: ${p}% (${Math.min((i+1)*S,file.size)/1048576|0} / ${file.size/1048576|0} MB)`;$("pb").style.width=Math.max(2,p*.3)+"%"}
 return id}
$("go").onclick=async()=>{
 const file=$("file").files[0];if(!file){$("st").style.display="block";$("err").textContent="Pehle video file chuno";return}
 $("go").disabled=true;$("out").innerHTML="";$("err").textContent="";$("st").style.display="block";
 try{localStorage.code=$("code").value}catch(e){}
 try{
  const id=await upload(file,$("code").value),fd=new FormData(),[a,b]=$("len").value.split(",");
  fd.append("upload_id",id);fd.append("minlen",a);fd.append("maxlen",b);fd.append("code",$("code").value);
  ["n","style","aspect","layout","res","cap","pos","wpl"].forEach(k=>fd.append(k,$(k).value));
  fd.append("hook",$("hook").checked?1:0);fd.append("zoom",$("zoom").checked?1:0);
  const r=await fetch("/api/jobs",{method:"POST",body:fd});
  if(!r.ok)throw new Error((await r.json()).detail||"Job shuru nahi hua");
  for(;;){await sl(2500);const s=await (await fetch("/api/jobs/"+id)).json();
   $("msg").textContent=s.msg;$("pb").style.width=s.pct+"%";
   if(s.status=="error")throw new Error(s.msg);
   if(s.status=="done"){$("out").innerHTML=s.clips.map(c=>`<div class="clip"><video src="${c.url}" controls playsinline preload="metadata"></video><b>${c.title.replace(/</g,"&lt;")}</b><br><small>Score ${c.score}</small><br><a href="${c.url}" download>Download</a></div>`).join("")+`<a href="/api/jobs/${id}/zip">Sab clips ZIP mein download karo</a>`;break}}
 }catch(e){$("err").textContent=e.message}
 $("go").disabled=false};
</script></body></html>
